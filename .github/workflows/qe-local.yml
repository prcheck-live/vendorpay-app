# Copied into vendorpay-app/.github/workflows/ by push-to-github.sh.
# Runs on the self-hosted runner on your Linux machine: deploys the PR head commit
# to the local QE environment and runs the team's tests against it.
name: QE (local machine)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: qe-environment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-and-test:
    # Never run code from forks on your machine.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, qivvra-qe]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Deploy this commit to QE and run the team's tests
        run: '"${QIVVRA_HOME:-$HOME/qivvra}/repos/qivvra-platform/deploy/linux-local/qe-deploy.sh" "$GITHUB_WORKSPACE"'
